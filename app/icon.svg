<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- jakeparr.dev mark: an inverted pendulum (pivot, rod, bob), the classic control problem
       where software meets hardware. Teal + off-white on the site's dark background. -->
  <rect width="64" height="64" rx="14" fill="#1b1b20"/>
  <line x1="20" y1="45" x2="42" y2="19" stroke="#38c7b0" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="42" cy="19" r="12" fill="#38c7b0"/>
  <circle cx="20" cy="45" r="10" fill="#ececf0"/>
  <circle cx="20" cy="45" r="3.5" fill="#1b1b20"/>
</svg>
